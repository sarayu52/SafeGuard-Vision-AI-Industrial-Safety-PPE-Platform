        <text x="96.3" y="271.6" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">
          Vest: OK
        </text>

        <!-- Left & Right Hands / Safety Gloves Regions -->
        <rect x="53.96" y="365.52" width="55.38" height="82.44"
              fill="rgba(239, 68, 68, 0.15)"
              stroke="#ef4444" stroke-width="2" stroke-dasharray="3,2" rx="3" />
        <rect x="245.66" y="365.52" width="55.38" height="82.44"
              fill="rgba(239, 68, 68, 0.15)"
              stroke="#ef4444" stroke-width="2" stroke-dasharray="3,2" rx="3" />
        
        <!-- Gloves Status Label on Wrist/Hand Zone -->
        <rect x="43.96" y="449.96" width="170.4" height="18"
              fill="#ef4444" rx="3" />
        <text x="47.96" y="462.96"
              fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">
