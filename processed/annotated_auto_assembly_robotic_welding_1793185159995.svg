      </text>
      <text x="50" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">
        Site: Detroit Auto Works Plant 3 · Real-time Spatial Hand, Torso &amp; Head Association
      </text>

      
      <!-- Worker Container Track 01 -->
      <g id="worker-0" class="worker-bbox">
        <!-- Main Person Bounding Box -->
        <rect x="71" y="164" width="213" height="458"
              fill="rgba(15, 23, 42, 0.08)" stroke="#ef4444" stroke-width="3" rx="4" />
        
        <!-- Header Pill with Track ID & Violation Status -->
        <rect x="71" y="136" width="220" height="26"
              fill="rgba(239, 68, 68, 0.95)" rx="4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))" />
        <text x="79" y="153" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
          Worker #1 [Track 01] · Violation detected
        </text>

        <!-- Head / Helmet Region -->
        <rect x="109.34" y="162" width="136.32" height="91.60000000000001"
              fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2" rx="2" />
        <text x="113.34" y="176" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">
          Helmet: OK
        </text>

        <!-- Eyes / Goggles Region -->
        
        <rect x="122.12" y="200.64" width="110.76" height="45.800000000000004"
              fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" rx="2" />
        <text x="124.12" y="210.64" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">
          Eyes: UNVERIFIED
        </text>
        

        <!-- Torso / Vest Region -->
        <rect x="92.3" y="255.60000000000002" width="170.4" height="183.20000000000002"
